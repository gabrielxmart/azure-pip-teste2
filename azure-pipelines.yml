jobs:
- job: BuildAndScan
  pool:
    vmImage: 'ubuntu-latest' # Ou o nome do nosso pool Self-Hosted
  steps:
  # 1. Libera o OAuth token para a extensão conseguir desenhar as abas de relatório na UI
  - checkout: self
    persistCredentials: true

  # (Aqui entraria o step de build normal do projeto, ex: Maven, npm, dotnet build)

  # 2. Task de avaliação da Sonatype (Versão 2)
  - task: SonatypeEvaluate@2
    displayName: 'Sonatype IQ - Policy Evaluation'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      nexusIqService: 'Sonatype-IQ-Conn' # Nome da Service Connection criada no passo 2
      applicationId: 'app-poc-xpi'       # Public ID da aplicação lá no IQ Server
      stage: 'build'                     # Estágio do ciclo de vida (build, stage-release, release)
      scanTargets: '**/*'                # Ou aponte direto para o binário gerado, ex: 'target/*.jar'
      ignoreSystemErrors: false