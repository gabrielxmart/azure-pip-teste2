jobs:
- job: BuildAndScan
  pool:
    vmImage: 'ubuntu-latest' # Ajuste se for rodar em pool Self-Hosted nosso
  steps:
  - checkout: self
    persistCredentials: true

  # (Seu step de build/restore de dependências aqui, se necessário)

  - task: SonatypeEvaluate@2
    displayName: 'Sonatype IQ - Policy Evaluation'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      nexusIqService: 'nexus-iq-connection'
      applicationId: 'app-poc-xpi' # Substitua pelo Public ID da aplicação no IQ Server
      stage: 'build'
      scanTargets: '**/*'
      ignoreSystemErrors: false
